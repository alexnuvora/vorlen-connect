name: McpOS Oracle inventory (shared OCI credentials)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcpos-oracle-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Inspect existing Oracle instance and A1 quota (read only)
        env:
          OCI_CONFIG_SECRET: ${{ secrets.VORLEN_OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.VORLEN_OCI_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_CONFIG_SECRET" || { echo '::error::Existing OCI config secret is missing in vorlen-connect'; exit 1; }
          test -n "$OCI_API_PRIVATE_KEY" || { echo '::error::Existing OCI signing key secret is missing in vorlen-connect'; exit 1; }
          mkdir -p "$HOME/.oci"
          printf '%s' "$OCI_API_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG_SECRET" > "$HOME/.oci/config"
          sed -i "s#^[[:space:]]*key_file[[:space:]]*=.*#key_file=$HOME/.oci/oci_api_key.pem#" "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"
          INSTANCE_ID='ocid1.instance.oc1.uk-london-1.anwgiljtdycw3nacwvc2l7y6y5mgkfyn2oawv2locpcblhzvewsdrxn243ca'
          TENANCY_ID='ocid1.tenancy.oc1..aaaaaaaaclnmrik5hypi734mzstra5mi752uy5ljxzihburzc3athnmpxw2a'
          echo '=== Existing cloudbox-sandbox VM ==='
          oci compute instance get --instance-id "$INSTANCE_ID" --query 'data.{name:"display-name",state:"lifecycle-state",shape:shape,availabilityDomain:"availability-domain",timeCreated:"time-created"}' --output json
          echo '=== Attached VNIC and public IP ==='
          VNIC_ID="$(oci compute vnic-attachment list --compartment-id "$TENANCY_ID" --instance-id "$INSTANCE_ID" --query 'data[0]."vnic-id"' --raw-output)"
          oci network vnic get --vnic-id "$VNIC_ID" --query 'data.{privateIp:"private-ip",publicIp:"public-ip",hostname:"hostname-label"}' --output json
          AD="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."availability-domain"' --raw-output)"
          echo '=== A1 shapes in the existing availability domain ==='
          oci compute shape list --compartment-id "$TENANCY_ID" --availability-domain "$AD" --query 'data[?contains(shape, `VM.Standard.A1.Flex`)].{shape:shape,ocpus:ocpus,memoryInGBs:"memory-in-gbs",networkBandwidthInGbps:"networking-bandwidth-in-gbps"}' --output json
          echo '=== A1 quota ==='
          oci limits value list --compartment-id "$TENANCY_ID" --service-name compute --query 'data[?contains(name, `standard-a1`)].{name:name,limit:value,used:used,available:available}' --output json || true
          echo 'Read-only inventory complete; no cloud resources changed.'