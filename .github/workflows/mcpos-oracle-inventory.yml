name: McpOS Oracle inventory (shared OCI credentials)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mcpos-oracle-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcpos-oracle-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install OCI CLI and jq
        run: |
          python -m pip install --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Inspect Oracle network, Ubuntu ARM image and A1 quota (read only)
        env:
          OCI_CONFIG_SECRET: ${{ secrets.VORLEN_OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.VORLEN_OCI_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_CONFIG_SECRET"; test -n "$OCI_API_PRIVATE_KEY"
          mkdir -p "$HOME/.oci"
          printf '%s' "$OCI_API_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"; chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG_SECRET" > "$HOME/.oci/config"
          sed -i "s#^[[:space:]]*key_file[[:space:]]*=.*#key_file=$HOME/.oci/oci_api_key.pem#" "$HOME/.oci/config"; chmod 600 "$HOME/.oci/config"
          INSTANCE_ID='ocid1.instance.oc1.uk-london-1.anwgiljtdycw3nacwvc2l7y6y5mgkfyn2oawv2locpcblhzvewsdrxn243ca'
          TENANCY_ID='ocid1.tenancy.oc1..aaaaaaaaclnmrik5hypi734mzstra5mi752uy5ljxzihburzc3athnmpxw2a'
          echo '=== Existing sandbox VM ==='
          oci compute instance get --instance-id "$INSTANCE_ID" --query 'data.{name:"display-name",state:"lifecycle-state",shape:shape,availabilityDomain:"availability-domain",compartment:"compartment-id"}' --output json
          VNIC_ID="$(oci compute vnic-attachment list --compartment-id "$TENANCY_ID" --instance-id "$INSTANCE_ID" --query 'data[0]."vnic-id"' --raw-output)"
          oci network vnic get --vnic-id "$VNIC_ID" --query 'data.{privateIp:"private-ip",publicIp:"public-ip",subnetId:"subnet-id",nsgIds:"nsg-ids"}' --output json > "$RUNNER_TEMP/vnic.json"
          SUBNET_ID="$(jq -r '.subnetId' "$RUNNER_TEMP/vnic.json")"
          echo '=== Existing VNIC and subnet ==='; cat "$RUNNER_TEMP/vnic.json"
          if [ -n "$SUBNET_ID" ] && [ "$SUBNET_ID" != null ]; then
            if oci network subnet get --subnet-id "$SUBNET_ID" --output json > "$RUNNER_TEMP/subnet-full.json"; then
              jq '{name:.data."display-name",cidr:.data."cidr-block",securityListIds:.data."security-list-ids",routeTableId:.data."route-table-id",prohibitPublicIp:.data."prohibit-public-ip-on-vnic"}' "$RUNNER_TEMP/subnet-full.json"
              jq -r '.data."security-list-ids"[]?' "$RUNNER_TEMP/subnet-full.json" | while read -r SL; do echo "=== Security list $SL ==="; oci network security-list get --security-list-id "$SL" --query 'data.{name:"display-name",ingress:"ingress-security-rules"}' --output json || true; done
            else echo 'Subnet details not readable by current API principal.'; fi
          fi
          AD="$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."availability-domain"' --raw-output)"
          echo '=== Available A1 shape ==='
          oci compute shape list --compartment-id "$TENANCY_ID" --availability-domain "$AD" --all --query 'data[?contains(shape, `VM.Standard.A1.Flex`)].{shape:shape,minimumOcpus:ocpus,minimumMemoryGB:"memory-in-gbs",networkBandwidthGbps:"networking-bandwidth-in-gbps"}' --output json
          echo '=== Ubuntu 24.04 ARM64 images ==='
          oci compute image list --compartment-id "$TENANCY_ID" --operating-system 'Canonical Ubuntu' --operating-system-version '24.04' --shape VM.Standard.A1.Flex --all --sort-by TIMECREATED --sort-order DESC --query 'data[0:5].{id:id,name:"display-name",os:"operating-system",version:"operating-system-version",sizeGB:"size-in-gbs",created:"time-created"}' --output json
          echo '=== A1 / ARM compute quota ==='
          oci limits value list --compartment-id "$TENANCY_ID" --service-name compute --all --output json | jq '[.data[] | select((.name|ascii_downcase|contains("a1")) or (.name|ascii_downcase|contains("arm"))) | {name,limit:.value,scopeType:."scope-type",availabilityDomain:."availability-domain"}]'
          echo 'Read-only inspection complete; no resources changed.'