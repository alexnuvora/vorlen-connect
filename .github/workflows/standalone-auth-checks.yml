name: Standalone authentication checks
on:
  pull_request:
    paths:
      - 'app/chatgpt-auth.ts'
      - 'app/login/**'
      - 'app/logout/**'
      - 'app/reset-password/**'
      - 'proxy.ts'
      - 'app/oauth/**'
      - 'app/.well-known/**'
      - 'app/mcp/**'
      - 'lib/mcp-oauth.mjs'
      - 'supabase/migrations/**'
      - 'lib/linkedin-service.mjs'
      - 'lib/direct-catalog.mjs'
      - 'lib/supabase-store.mjs'
      - 'app/api/cron/**'
      - 'supabase/migrations/**'
      - 'lib/standalone-auth.mjs'
      - '.github/workflows/standalone-auth-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint changed auth files
        run: pnpm exec eslint app/chatgpt-auth.ts app/login/page.tsx app/login/session/route.ts app/logout/route.ts app/reset-password/**/*.tsx app/reset-password/**/route.ts proxy.ts
      - run: pnpm test
      - run: pnpm build
