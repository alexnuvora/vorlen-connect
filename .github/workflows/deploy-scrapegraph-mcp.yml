name: Deploy ScrapeGraphAI MCP to Oracle (isolated)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scrapegraph-mcp/**'
      - '.github/workflows/deploy-scrapegraph-mcp.yml'
permissions:
  contents: read
concurrency:
  group: oracle-scrapegraph-mcp-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: python3 -m py_compile scrapegraph-mcp/server.py
      - name: Inspect capacity then deploy isolated service
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VORLEN_WORKER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          test -n "${SSH_PRIVATE_KEY:-}"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          ssh-keygen -y -P '' -f "$KEY" >/dev/null
          SSH_OPTS=(-i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12)
          HOST=ubuntu@145.241.230.145
          ssh "${SSH_OPTS[@]}" "$HOST" '
            set -eu
            test "$(hostname)" = vorlen
            test "$(id -u)" -ne 0
            sudo -n true
            free_mb=$(awk "/MemAvailable:/{print int(\$2/1024)}" /proc/meminfo)
            disk_mb=$(df -Pm / | awk "NR==2{print \$4}")
            echo "Available RAM: $free_mb MB; free disk: $disk_mb MB"
            test "$free_mb" -ge 1000 || { echo "Insufficient RAM; skipped deployment"; exit 1; }
            test "$disk_mb" -ge 3500 || { echo "Insufficient disk; skipped deployment"; exit 1; }
          '
          scp "${SSH_OPTS[@]}" scrapegraph-mcp/server.py scrapegraph-mcp/requirements.txt scrapegraph-mcp/scrapegraph-mcp.service "$HOST:/tmp/"
          ssh "${SSH_OPTS[@]}" "$HOST" '
            set -eu
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv
            if ! id scrapegraph-mcp >/dev/null 2>&1; then
              sudo -n useradd -r -m -d /var/lib/scrapegraph-mcp -s /usr/sbin/nologin scrapegraph-mcp
            fi
            sudo -n install -d -m 755 /opt/scrapegraph-mcp
            sudo -n install -m 644 /tmp/server.py /tmp/requirements.txt /opt/scrapegraph-mcp/
            sudo -n python3 -m venv /opt/scrapegraph-mcp/.venv
            sudo -n /opt/scrapegraph-mcp/.venv/bin/pip install --no-cache-dir -r /opt/scrapegraph-mcp/requirements.txt
            sudo -n /opt/scrapegraph-mcp/.venv/bin/python -m playwright install chromium
            sudo -n install -m 644 /tmp/scrapegraph-mcp.service /etc/systemd/system/scrapegraph-mcp.service
            sudo -n systemctl daemon-reload
            if sudo -n test -f /etc/scrapegraph-mcp.env; then
              sudo -n systemctl enable --now scrapegraph-mcp
              sudo -n systemctl restart scrapegraph-mcp
              sudo -n systemctl is-active --quiet scrapegraph-mcp
            else
              echo "Packages installed. /etc/scrapegraph-mcp.env missing: service not started. No public endpoint exposed."
            fi
            rm -f /tmp/server.py /tmp/requirements.txt /tmp/scrapegraph-mcp.service
          '
