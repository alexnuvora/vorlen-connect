name: Verify LinkedIn Session Foundation
on:
  push:
    branches: [feature/session-integration-foundation]
    paths:
      - '.github/workflows/test-session-integration.yml'
      - 'lib/session-integration.mjs'
      - 'tests/session-integration.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run session state and leakage tests
        run: node --test tests/session-integration.test.mjs
