name: Verify Vorlen LinkedIn migration (Supabase CLI)
on:
  push:
    branches: [feature/linkedin-mcp-publishing]
    paths: ['.github/workflows/verify-vorlen-linkedin.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check linked project and migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VORLEN_CONNECT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.VORLEN_CONNECT_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing project access token"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Add VORLEN_CONNECT_SUPABASE_DB_PASSWORD to GitHub Actions secrets"; exit 1; }
          supabase link --project-ref oulypjxpbrlxbjrxzryf
          supabase migration list --linked
          supabase db push --linked --dry-run
