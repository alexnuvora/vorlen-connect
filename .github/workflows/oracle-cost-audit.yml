name: Audit Oracle Always Free footprint and reported costs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-cost-audit.yml', 'scripts/oracle-cost-audit.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet oci==2.187.2
      - name: Read-only inventory and cost audit
        env:
          VORLEN_OCI_CONFIG: ${{ secrets.VORLEN_OCI_CONFIG }}
          VORLEN_OCI_API_PRIVATE_KEY: ${{ secrets.VORLEN_OCI_API_PRIVATE_KEY }}
        run: python scripts/oracle-cost-audit.py
