name: Vorlen Connect Supabase access check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-project-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check required secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VORLEN_CONNECT_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing VORLEN_CONNECT_SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Confirm exact Vorlen Connect project access (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VORLEN_CONNECT_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase projects list --output json > /tmp/vorlen-projects.json
          node --input-type=module -e '
            import fs from "node:fs";
            const payload = JSON.parse(fs.readFileSync("/tmp/vorlen-projects.json", "utf8"));
            const projects = Array.isArray(payload) ? payload : payload.projects || [];
            const found = projects.some(p => (p.id || p.ref) === "oulypjxpbrlxbjrxzryf");
            if (!found) {
              console.error("Vorlen Connect Supabase project inaccessible to provided token.");
              process.exitCode = 1;
            } else {
              console.log("Vorlen Connect project access confirmed (read-only).");
            }
          '
          rm -f /tmp/vorlen-projects.json
